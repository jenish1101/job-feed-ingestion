services:
  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - jobfeed-mongo:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  jobfeed-mongo:
